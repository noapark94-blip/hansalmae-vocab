<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>한살매 단어학습 - 서버 이전 완료</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:#f8f5fa;color:#29232d}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px}
.wrap{width:min(440px,100%);text-align:center}
.card{background:#fff;border:1px solid rgba(120,76,118,.10);border-radius:28px;padding:42px 26px 36px;box-shadow:0 18px 50px rgba(85,54,83,.10)}
.mark{width:76px;height:76px;border-radius:24px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;background:#f1e6f0;font-size:38px}
h1{font-size:25px;margin:0 0 16px;color:#7f2d72;letter-spacing:-.5px}
.lead{font-size:17px;font-weight:700;line-height:1.65;margin:0 0 12px}
.desc{font-size:15px;line-height:1.75;color:#706a72;margin:0}
.move{display:block;width:100%;margin-top:28px;padding:16px 18px;border:0;border-radius:16px;background:#7f2d72;color:#fff;text-decoration:none;font-size:16px;font-weight:800;box-shadow:0 8px 20px rgba(127,45,114,.20);-webkit-tap-highlight-color:transparent}
.move:active{transform:translateY(1px)}
.foot{margin-top:17px;color:#9b959c;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<main class="wrap">
  <section class="card" role="status" aria-live="polite">
    <div class="mark">🚀</div>
    <h1>서버 이전이 완료되었습니다</h1>
    <p class="lead">한살매 단어학습이<br>새로운 서버로 이전되었습니다.</p>
    <p class="desc">아래 버튼을 눌러 새로운 단어앱으로 이동해 주세요.</p>
    <a class="move" href="https://noapark94-blip.github.io/hansalmae-vocab-app/index.html">새 서버로 이동</a>
    <div class="foot">버튼을 누르면 새 서버로 바로 연결됩니다.</div>
  </section>
</main>
<script>
window.__HSM_SERVER_MOVED__ = true;
</script>
</body>
</html>
