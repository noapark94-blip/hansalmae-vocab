<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한살매 단어학습</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fb;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .card {
      width: calc(100% - 40px);
      max-width: 420px;
      padding: 40px 24px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      min-height: 24px;
      color: #555;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>한살매 단어학습</h1>
    <p>GitHub와 Apps Script 연결 테스트</p>

    <button type="button" onclick="testServer()">
      서버 연결 확인
    </button>

    <p id="result"></p>
  </main>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbw0txceGnFvMyMkkWHJPnxLrVmgjlASQCcBuYc6IFn7TXd2KYc6yMqaKPzm3MYydrHWCg/exec';

    async function testServer() {
      const resultElement =
        document.getElementById('result');

      resultElement.textContent =
        '서버에 연결 중입니다...';

      try {
        const response = await fetch(
          API_URL + '?action=health'
        );

        const data = await response.json();

        resultElement.textContent =
          data.message;
      } catch (error) {
        resultElement.textContent =
          '서버 연결 실패: ' + error.message;
      }
    }
  </script>
</body>
</html>
