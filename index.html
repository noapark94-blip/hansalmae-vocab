<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한살매 단어학습</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fb;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .card {
      width: calc(100% - 40px);
      max-width: 420px;
      padding: 40px 24px;
      box-sizing: border-box;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #555;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>한살매 단어학습</h1>
    <p>GitHub Pages 연결 테스트가 완료되었습니다.</p>
  </main>
</body>
</html>
