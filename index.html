<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>한살매 단어학습 - 서버 이전 안내</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:#f8f5fa;color:#29232d}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px}
.wrap{width:min(440px,100%);text-align:center}.card{background:#fff;border:1px solid rgba(120,76,118,.10);border-radius:28px;padding:42px 26px 36px;box-shadow:0 18px 50px rgba(85,54,83,.10)}
.mark{width:76px;height:76px;border-radius:24px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;background:#f1e6f0;font-size:38px}
h1{font-size:25px;margin:0 0 16px;color:#7f2d72;letter-spacing:-.5px}.lead{font-size:17px;font-weight:700;line-height:1.65;margin:0 0 14px}.desc{font-size:15px;line-height:1.75;color:#706a72;margin:0}
.badge{display:inline-block;margin-top:26px;padding:9px 14px;border-radius:999px;background:#f6f1f6;color:#87627f;font-size:13px;font-weight:700}.foot{margin-top:18px;color:#a39da4;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<main class="wrap">
  <section class="card" role="alert" aria-live="assertive">
    <div class="mark">🚧</div>
    <h1>서버 이전 안내</h1>
    <p class="lead">현재 한살매 단어학습 서버를<br>새로운 서버로 이전하고 있습니다.</p>
    <p class="desc">보다 빠르고 안정적인 서비스 제공을 위해<br>이전 작업 중에는 모든 기능의 이용이 제한됩니다.<br><br>이전 완료 후 다시 이용해 주세요.</p>
    <div class="badge">현재 서비스 일시 중단</div>
    <div class="foot">이용에 불편을 드려 죄송합니다.</div>
  </section>
</main>
<script>
// 유지보수 화면에서는 기존 API/로그인/시험 코드를 전혀 실행하지 않습니다.
window.__HSM_MAINTENANCE__ = true;
</script>
</body>
</html>
